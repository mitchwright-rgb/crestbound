<svg xmlns="http://www.w3.org/2000/svg" width="384" height="72" viewBox="0 0 384 72" shape-rendering="crispEdges">
  <title>Sunny high-clarity vector pixel animation master</title>
  <defs>
    <!-- Faithful vector redraw of the approved tiny Sunny: round head, three crest curls, freckles and oversized sneakers. -->
    <g id="head">
      <path fill="#1E1E1E" d="M17 7h3V4h3V2h3V0h6v4h-6v1h-3v3h-3v2h-3zm3 3h3V7h4V5h6v4h-6v1h-3v3h-4zm1 3h3v-2h4V9h5v5h-3v-2h-2v1h-4v3h-3z"/>
      <path fill="#F5B92B" d="M19 7h2V5h3V3h3V2h4v1h-4v2h-3v2h-3v2h-2zm3 3h2V8h3V7h5v1h-5v2h-3v2h-2zm1 3h2v-1h3v-1h3v2h-3v1h-3v2h-2z"/>
      <path fill="#1E1E1E" d="M8 5h12v2h4v2h2v3h2v8h-2v3h-4v3H10v-2H7v-2H5v-4H3v-7h2V8h3z"/>
      <path fill="#F5D263" d="M8 7h11v2h4v2h2v3h1v5h-2v3h-3v2H11v-2H8v-2H6v-3H5v-5h2V9h1z"/>
      <path fill="#FFE58A" d="M8 8h8v1h-5v2H8v3H6v-2h1V9h1z"/>
      <rect x="7" y="12" width="7" height="8" fill="#FFF8E9"/><rect x="17" y="11" width="7" height="9" fill="#FFF8E9"/>
      <path fill="#1E1E1E" d="M9 13h4v6H9zm10-1h4v7h-4z"/>
      <rect x="10" y="13" width="1" height="2" fill="#FFF8E9"/><rect x="20" y="12" width="1" height="2" fill="#FFF8E9"/>
      <rect x="7" y="10" width="5" height="1" fill="#A96F12"/><rect x="18" y="9" width="5" height="1" fill="#A96F12"/>
      <path fill="#1E1E1E" d="M11 20h9v2h-1v2h-6v-1h-2z"/><rect x="14" y="22" width="4" height="1" fill="#EF6F52"/>
      <rect x="6" y="20" width="2" height="1" fill="#E29B24"/><rect x="8" y="22" width="1" height="1" fill="#E29B24"/><rect x="22" y="20" width="2" height="1" fill="#E29B24"/><rect x="24" y="19" width="1" height="1" fill="#E29B24"/>
    </g>
    <g id="body">
      <path fill="#1E1E1E" d="M11 24h10v2h2v10h-2v3H11v-2H9V27h2z"/>
      <path fill="#E2AA2F" d="M12 26h8v2h1v7h-2v2h-6v-2h-2v-7h1z"/>
      <rect x="13" y="27" width="2" height="8" fill="#F5D263"/>
    </g>
    <g id="hand"><rect width="5" height="5" fill="#1E1E1E"/><rect x="1" y="1" width="3" height="3" fill="#F5D263"/><rect x="4" y="1" width="1" height="2" fill="#F5D263"/></g>
    <g id="shoe"><path fill="#1E1E1E" d="M1 0h4v2h4v5H0V2h1z"/><path fill="#FFF8E9" d="M2 1h2v2h4v3H1V3h1z"/><rect x="1" y="1" width="4" height="2" fill="#12B5B0"/><rect x="0" y="6" width="9" height="1" fill="#E2AA2F"/></g>
  </defs>

  <g transform="scale(1.5)">
  <!-- idle -->
  <g><use href="#head"/><use href="#body"/><rect x="6" y="27" width="4" height="2" fill="#E2AA2F"/><use href="#hand" x="2" y="27"/><rect x="22" y="27" width="4" height="2" fill="#E2AA2F"/><use href="#hand" x="26" y="27"/><rect x="11" y="38" width="3" height="4" fill="#E2AA2F"/><rect x="19" y="38" width="3" height="4" fill="#E2AA2F"/><use href="#shoe" x="5" y="41"/><use href="#shoe" x="18" y="41"/></g>
  <!-- run A -->
  <g transform="translate(32)"><use href="#head" x="1"/><use href="#body"/><rect x="5" y="27" width="7" height="2" fill="#E2AA2F"/><use href="#hand" x="1" y="26"/><rect x="21" y="25" width="7" height="2" fill="#E2AA2F"/><use href="#hand" x="27" y="23"/><rect x="10" y="37" width="8" height="3" fill="#E2AA2F"/><rect x="20" y="37" width="3" height="5" fill="#E2AA2F"/><use href="#shoe" x="2" y="38"/><use href="#shoe" x="19" y="41"/></g>
  <!-- run B -->
  <g transform="translate(64)"><use href="#head"/><use href="#body"/><rect x="5" y="25" width="7" height="2" fill="#E2AA2F"/><use href="#hand" x="1" y="23"/><rect x="21" y="29" width="7" height="2" fill="#E2AA2F"/><use href="#hand" x="27" y="28"/><rect x="10" y="37" width="3" height="5" fill="#E2AA2F"/><rect x="18" y="38" width="8" height="3" fill="#E2AA2F"/><use href="#shoe" x="4" y="41"/><use href="#shoe" transform="translate(31 38) scale(-1 1)"/></g>
  <!-- jump -->
  <g transform="translate(96 -1)"><use href="#head"/><use href="#body"/><rect x="5" y="28" width="6" height="2" fill="#E2AA2F"/><use href="#hand" x="1" y="28"/><rect x="21" y="23" width="3" height="7" fill="#E2AA2F"/><use href="#hand" x="20" y="19"/><rect x="9" y="37" width="5" height="5" fill="#E2AA2F"/><rect x="20" y="37" width="4" height="5" fill="#E2AA2F"/><use href="#shoe" x="3" y="41"/><use href="#shoe" x="20" y="41"/></g>
  <!-- fall -->
  <g transform="translate(128)"><use href="#head"/><use href="#body" y="-1"/><rect x="3" y="26" width="8" height="2" fill="#E2AA2F"/><use href="#hand" y="24"/><rect x="21" y="26" width="8" height="2" fill="#E2AA2F"/><use href="#hand" x="28" y="24"/><rect x="9" y="36" width="5" height="6" fill="#E2AA2F"/><rect x="20" y="36" width="5" height="6" fill="#E2AA2F"/><use href="#shoe" x="2" y="40"/><use href="#shoe" transform="translate(32 40) scale(-1 1)"/></g>
  <!-- dash -->
  <g transform="translate(160 2)"><use href="#head" x="2" y="2"/><use href="#body" x="1"/><rect x="2" y="30" width="10" height="3" fill="#E2AA2F"/><use href="#hand" y="28"/><rect x="21" y="30" width="8" height="3" fill="#E2AA2F"/><use href="#hand" x="28" y="28"/><rect x="8" y="38" width="8" height="3" fill="#E2AA2F"/><rect x="20" y="38" width="7" height="3" fill="#E2AA2F"/><use href="#shoe" x="1" y="39"/><use href="#shoe" transform="translate(33 39) scale(-1 1)"/><rect x="0" y="14" width="7" height="2" fill="#78D7D2"/><rect x="1" y="19" width="9" height="2" fill="#18A7A2"/></g>
  <!-- hit -->
  <g transform="translate(192 1)"><use href="#head" y="2"/><use href="#body" y="2"/><rect x="5" y="31" width="6" height="2" fill="#E2AA2F"/><use href="#hand" x="1" y="30"/><rect x="21" y="31" width="6" height="2" fill="#E2AA2F"/><use href="#hand" x="26" y="30"/><rect x="9" y="40" width="5" height="3" fill="#E2AA2F"/><rect x="20" y="40" width="5" height="3" fill="#E2AA2F"/><use href="#shoe" x="2" y="41"/><use href="#shoe" transform="translate(33 41) scale(-1 1)"/><rect x="28" y="9" width="3" height="9" fill="#EF6F52"/><rect x="25" y="12" width="7" height="3" fill="#EF6F52"/></g>
  <!-- win -->
  <g transform="translate(224 -1)"><use href="#head"/><use href="#body"/><rect x="6" y="22" width="3" height="9" fill="#E2AA2F"/><use href="#hand" x="4" y="18"/><rect x="22" y="18" width="3" height="12" fill="#E2AA2F"/><use href="#hand" x="21" y="14"/><rect x="11" y="38" width="3" height="4" fill="#E2AA2F"/><rect x="19" y="38" width="3" height="4" fill="#E2AA2F"/><use href="#shoe" x="5" y="41"/><use href="#shoe" x="18" y="41"/></g>
  </g>
</svg>
